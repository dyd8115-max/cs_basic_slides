<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여러가지 AI 활용법</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">여러가지 AI 활용법</div>
  <div class="tabs">
    <button class="tab on" onclick="go(0)">📑 표지</button>
    <button class="tab"    onclick="go(1)">🛡️ 보안</button>
    <button class="tab"    onclick="go(2)">🏥 의료</button>
    <button class="tab"    onclick="go(3)">🎯 소개</button>
    <button class="tab"    onclick="go(4)">① 건강</button>
    <button class="tab"    onclick="go(5)">② 생활비</button>
    <button class="tab"    onclick="go(6)">③ 네비</button>
    <button class="tab"    onclick="go(7)">📋 AI 분석</button>
    <button class="tab"    onclick="go(8)">🏁 마무리</button>
  </div>
  <div class="slide-nav">
    <button class="slide-btn" onclick="slideBy(-1)">‹</button>
    <span class="slide-dot-row" id="dotRow"></span>
    <button class="slide-btn" onclick="slideBy(1)">›</button>
  </div>
</header>

<main></main>

<!-- ══ 주소 검색 모달 ══ -->
<div id="addrModal" class="addr-modal-overlay" onclick="if(event.target===this)closeAddrModal()">
  <div class="addr-modal">
    <div class="addr-modal-head">
      <div class="addr-modal-title">
        <span style="font-size:18px">🗺️</span>
        주소 검색
      </div>
      <button class="addr-modal-close" onclick="closeAddrModal()">✕</button>
    </div>
    <div class="addr-modal-search">
      <input id="addrModalInput" class="addr-modal-input"
             placeholder="도로명, 건물명, 지번 주소 입력"
             autocomplete="off"
             oninput="addrModalSearch(this.value)"
             onkeydown="if(event.key==='Enter')addrModalSearch(this.value)">
      <button class="addr-modal-search-btn" onclick="addrModalSearch(document.getElementById('addrModalInput').value)">검색</button>
    </div>
    <div id="addrModalResults" class="addr-modal-results">
      <div class="addr-modal-hint">
        <div class="addr-hint-icon">🔍</div>
        <div class="addr-hint-text">도로명 주소, 건물명, 지번을 입력하세요</div>
        <div class="addr-hint-sub">예: 강남구 테헤란로 152 · 신반포자이 · 정자동 178</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
